<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),R=n=>Math.random()*n|0;x.imageSmoothingEnabled=false;
const CL=[['전사','#b33','#ddd',17,3.4,.5,3.5,'강타,회전베기,분쇄,돌진,대지가르기,광폭화,용참,천지검','pppppppp'],
['마법사','#63c','#fd4',9,.8,4.2,7,'파이어볼,아이스스톰,썬더,메테오,블리자드,체인라이트닝,블랙홀,아포칼립스','mmmmmmmm'],
['궁수','#2a6','#a64',11,3.1,.8,4.5,'속사,관통사격,삼연사,폭렬화살,독화살,저격,화살비,천공의활','pppppppp'],
['도적','#446','#8cf',11,3.3,.7,4,'기습,연속찌르기,독칼,그림자베기,암살,난도질,급소찌르기,죽음의춤','pppppppp'],
['성직자','#eee','#fd4',12,1.2,3.4,7,'성스러운빛,치유,심판,대치유,천벌,회복의빛,신의분노,천상의축복','mhmhmhmh'],
['기사','#58b','#eef',19,3,.5,3,'방패강타,창돌격,성검,철벽반격,용기사,성스러운돌진,성기사의검,신성일섬','pppppppp'],
['닌자','#223','#9ac',10,3.5,1,5,'수리검,분신참,화둔,뇌둔,연막베기,섬광,팔문둔갑,암흑난무','ppmmpppp'],
['소환사','#a5a','#6f6',9,.7,4,7,'불정령,물정령,바람정령,대지정령,이프리트,바하무트,용신소환,세계수','mmmmmmmm'],
['연금술사','#a73','#6cf',11,1.5,3.5,6,'산성병,폭탄,연금화염,맹독,변성,현자의돌,철기폭발,대폭발','mmmmmmmm'],
['음유시인','#c49','#fc6',10,1.5,3.2,7,'노래,회복송,불협화음,진군가,진혼곡,마법의선율,영웅서사,종말의노래','mhmhmhmh'],
['암흑기사','#303','#c3f',16,3.2,1.5,4,'암흑베기,흡혈,저주,영혼흡수,어둠폭발,지옥불,마검해방,종말','pdpdpdpd'],
['무도가','#e82','#fff',14,3.3,.6,4,'정권,발차기,기합,연환권,용권,번개차기,파천권,무적연격','pppppppp']];
const HC=['#431','#fd5','#832','#222','#fa5','#ccc','#111','#4a4','#a52','#d4a','#418','#c22'];
const UL=[1,8,16,28,42,58,76,95],MU=[1.4,1.8,2.2,2.7,3.3,4,4.8,6],MC=[4,8,13,20,30,42,58,80];
const ZN='시작의 초원,속삭이는 숲,모래 사막,안개 늪지,얼어붙은 설원,어둠의 묘지,화산지대,고대 폐허,천공 신전,심연의 동굴,지옥 불길,마왕성'.split(',');
const MN='슬라임,들박쥐,도깨비불;독버섯 슬라임,흡혈나방,나무 유령;모래 젤리,사막 박쥐,미라;늪 슬라임,늪파리,늪망령;얼음 슬라임,서리 박쥐,동사자;썩은 점액,묘지 박쥐,해골 병사;마그마 슬라임,화염 박쥐,불타는 해골;이끼 골렘,가고일,폐허의 망령;구름 정령,하피,타락 천사;심연 슬라임,심연 박쥐,그림자;지옥 점액,임프,지옥 해골;어둠의 점액,마계 박쥐,데스나이트'.split(';').map(s=>s.split(','));
const BN='슬라임왕,흡혈나방 여왕,사막의 파라오,늪의 거대 슬라임,서리 대박쥐왕,리치왕,용암 슬라임 군주,가고일 군주,타락 대천사,크라켄,지옥공작,마왕'.split(',');
const GR=['#3a7a2a','#2a5a2a','#c9a255','#4a6a5a','#cfe4f0','#3a3a4a','#6a2a1a','#6b6b5b','#7a9ac0','#1a2a4a','#5a1010','#201030'],OC=['#1e5a1e','#0e3a1e','#2a7a2a','#2a4a3a','#8ab','#555','#a42','#888','#fff','#307','#a00','#508'];
const HT=['...HHHH...','..HHHHHH..','..HSSSSH..','..SeSSeS..','...SSSS...','..AAAAAA..','.SAAAAAAS.','.SAAAAAAS.','..AAAAAA..'],F=[['..LL..LL..','..LL..LL..','.BBB..BBB.'],['..LL...LL.','...L..LL..','.BB...BBB.']];
const SPR=[['............','....bbbb....','..bbbbbbbb..','.bbbbbbbbbb.','.bbwkbbwkbb.','bbbbbbbbbbbb','bbbbkkkkbbbb','bbbbbbbbbbbb','.dbbbbbbbbd.','..dddddddd..'],
['b..........b','bb...bb...bb','bbb.bbbb.bbb','bbbbwkbbwkbb','bbbbbbbbbbbb','.bbbbbbbbbb.','..bbbddbbb..','...bd..db...','............','............'],
['...dddddd...','..dbbbbbbd..','.dbbbbbbbbd.','.dbwwbbwwbd.','.dbwkbbwkbd.','.dbbbbbbbbd.','..dbbkkbbd..','..dbdbbdbd..','...dbdbdb...','............']];
const W=56,HH=56,TW=[[28,28],[28,19],[37,28],[28,37],[12,28],[44,28],[28,5],[28,51]],M=new Uint8Array(W*HH),BPOS=[];
const zn=(a,b)=>Math.min(11,Math.hypot(a-28,b-28)/2.3|0);
function gen(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;for(let i=0;i<W*HH;i++)M[i]=r()<.14?1:0;
TW.forEach(([a,b])=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)M[(b+j)*W+a+i]=0;M[b*W+a]=3});
for(let z=0;z<12;z++){const d=z*2.3+1.3,an=z*2.4,a=Math.round(28+Math.cos(an)*d),b=Math.round(28+Math.sin(an)*d);BPOS[z]=[a,b];for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(M[(b+j)*W+a+i]!=3)M[(b+j)*W+a+i]=0;M[b*W+a]=4}}gen();
let mode='title',sel=0,P,E,busy=0,fx=[],lg=[],hx=0,ex=0,T=0,D='',AC,mu=1,bt=0;
const need=L=>Math.floor(12*L**2.1+L*10),dm=(a,m,d)=>Math.max(1,Math.round(a*m*(.85+Math.random()*.3)-d*.5)),B=(t,f,d)=>`<button ${d?'disabled':''} onclick="${f}">${t}</button>`;
const ST=()=>{const c=CL[P.c],l=P.lv,wm=(1+(P.wi||0)*.22+.08*P.w+.15*HA(3))*(P.aw?1.3:1);return{mhp:Math.floor((50+l*c[3])*(1+.2*HA(0))),mmp:Math.floor((20+l*c[6])*(1+.3*HA(1))),atk:(6+l*c[4])*wm,mag:(6+l*c[5])*wm,def:(3+l*1.2)*(1+.15*P.a)}};
function ui(h){$('menu').innerHTML=h;$('pad').style.display=mode=='map'?'grid':'none'}
function say(t){lg.push(t);if(lg.length>4)lg.shift();$('log').innerHTML=lg.join('<br>')}
function hud(){if(!P){$('hud').innerHTML='도트 용사 연대기 — 최대 Lv100';return}const s=ST();$('hud').innerHTML=`Lv${P.lv} ${CL[P.c][0]} · HP ${P.hp|0}/${s.mhp} · MP ${P.mp|0}/${s.mmp} · ${P.g}G<br>${ZN[P.rm||0]} · 포션${P.pot} 에테르${P.eth} · 무기+${P.w} 방어구+${P.a}<div class=bar><i style="width:${P.lv>=100?100:P.exp/need(P.lv)*100}%"></i></div>`}
function snd(f,d,t,v){if(!AC||!mu)return;const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const ML=[262,330,392,330,294,349,440,349,262,330,392,523,494,392,330,392],BL=[220,220,262,220,330,220,262,330,247,247,294,247,370,247,294,370];

function title(){mode='title';hud();let h='';CL.forEach((c,i)=>h+=B(c[0],`sel=${i};title()`,i==sel));const c=CL[sel];h+=B('모험 시작','NG()')+B('이어하기','LD()',!(localStorage.getItem('dotrpg1')||window.SVR))+B('🔊','mu=!mu');ui(h);say(`${c[0]}: 체력${c[3]} 힘${c[4]} 마력${c[5]} / 스킬 8종 — ${c[7].split(',').slice(0,3).join(', ')}…`)}
function NG(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();P={c:sel,lv:1,exp:0,g:100,pot:3,eth:1,w:0,a:0,x:28,y:29,rx:28,ry:29,b:Array(12).fill(0)};const s=ST();P.hp=s.mhp;P.mp=s.mmp;lg=[];say('마왕이 세계를 어둠으로 덮었다… 용사여, 일어나라!');toMap()}
function LD(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();P=JSON.parse(localStorage.getItem('dotrpg1'));P.rx=P.x;P.ry=P.y;lg=[];say('저장된 모험을 불러왔다.');toMap()}catch(e){}}
function SV(){try{localStorage.setItem('dotrpg1',JSON.stringify(P));SS();say('저장했다!')}catch(e){say('저장 실패')}}
function toMap(){for(let z=0;z<12;z++)M[BPOS[z][1]*W+BPOS[z][0]]=P.b[z]?0:4;mode='map';hud();ui(B('메뉴','MM()'));if(P.b)SV()}
function MM(){if(mode!='map')return;const s=ST();let sk='';CL[P.c][7].split(',').forEach((n,i)=>sk+=(P.lv>=UL[i]?n:'🔒Lv'+UL[i])+' ');say(`다음 레벨까지 ${P.lv>=100?'MAX':need(P.lv)-P.exp} EXP / 공${s.atk|0} 마${s.mag|0} 방${s.def|0}`);say(sk);ui(B('포션','UP()',!P.pot)+B('에테르','UE()',!P.eth)+B('저장','SV()')+B('닫기','toMap()'))}
function UP(){const s=ST();P.pot--;P.hp=Math.min(s.mhp,P.hp+s.mhp*.35);snd(660,.2);hud();MM()}function UE(){const s=ST();P.eth--;P.mp=Math.min(s.mmp,P.mp+s.mmp*.35);snd(740,.2);hud();MM()}
function step(d){if(mode!='map'||Math.abs(P.x-P.rx)+Math.abs(P.y-P.ry)>.45)return;const nx=P.x+(d=='R')-(d=='L'),ny=P.y+(d=='D')-(d=='U');if(nx<0||ny<0||nx>=W||ny>=HH||M[ny*W+nx]==1)return;P.x=nx;P.y=ny;const s=ST();P.mp=Math.min(s.mmp,P.mp+1+P.lv/12);const t=M[ny*W+nx];hud();if(t==3)return town();if(t==4)return fight(1);if(R(10)==0)fight(0)}
function town(){mode='town';snd(523,.15);say('마을에 도착했다. 편안한 음악이 흐른다.');TM()}
function TM(){hud();ui(B(`여관 ${10+P.lv*3}G`,'INN()')+B('상점','SH()')+B('저장','SV()')+B('나가기','toMap()'))}
function INN(){const c=10+P.lv*3;if(P.g<c)return say('골드가 부족하다.');P.g-=c;const s=ST();P.hp=s.mhp;P.mp=s.mmp;snd(880,.4);say('푹 쉬었다. HP/MP 전부 회복!');TM()}
const WC=w=>Math.floor(150*1.5**w),PC=()=>30+P.lv*2;
function SH(){hud();ui(B(`포션 ${PC()}G`,'BY(0)')+B(`에테르 ${PC()*2}G`,'BY(1)')+B(P.w>=15?'무기 MAX':`무기+${P.w+1} ${WC(P.w)}G`,'BY(2)',P.w>=15)+B(P.a>=15?'방어구 MAX':`방어구+${P.a+1} ${WC(P.a)}G`,'BY(3)',P.a>=15)+B('뒤로','TM()'))}
function BY(i){const c=[PC(),PC()*2,WC(P.w),WC(P.a)][i];if(P.g<c)return say('골드가 부족하다.');P.g-=c;[()=>P.pot++,()=>P.eth++,()=>P.w++,()=>P.a++][i]();snd(990,.15);SH()}
function fight(boss){const z=zn(P.x,P.y),ml=boss?Math.min(100,z*8+8):Math.max(1,Math.floor(z*8.2)+R(6)-1),k=R(3),m=boss?3.2:1;E={z,boss,ml,k,n:boss?BN[z]:MN[z][k],hp:0,al:1,atk:(6+ml*3.1)*(boss?1.3:1),def:2+ml*.9,exp:(8+ml*ml*.35)*(boss?6:1),g:(3+ml*1.6)*(boss?8:1)};E.hp=E.mhp=Math.floor((25+ml*8+ml*ml*.35)*m);mode='battle';P.df=0;busy=0;say(boss?`💀 ${E.n} Lv${ml} 이(가) 나타났다!`:`${E.n} Lv${ml} 이(가) 나타났다!`);bmain()}
function bmain(){hud();P.df=0;ui(B('공격','A()')+B('스킬','SM()')+B('방어','DF()')+B('아이템','IM()')+B('도망','FL()'))}
function SM(){let h='';CL[P.c][7].split(',').forEach((n,i)=>h+=B(P.lv<UL[i]?`🔒Lv${UL[i]}`:`${n}<br>MP${MC[i]}`,`S(${i})`,P.lv<UL[i]||P.mp<MC[i]));ui(h+B('취소','bmain()'))}
function IM(){ui(B('포션 x'+P.pot,'BP()',!P.pot)+B('에테르 x'+P.eth,'BE()',!P.eth)+B('취소','bmain()'))}
function BP(){const s=ST();P.pot--;P.hp=Math.min(s.mhp,P.hp+s.mhp*.35);fx.push({t:0,k:'h',x:90,y:110});say('포션 사용! HP 회복');snd(660,.2);endP()}function BE(){const s=ST();P.eth--;P.mp=Math.min(s.mmp,P.mp+s.mmp*.35);say('에테르 사용! MP 회복');snd(740,.2);endP()}
function DF(){P.df=1;say('방어 태세!');endP(1)}
function FL(){if(E.boss)say('보스에게서는 도망칠 수 없다!');else if(R(100)<55){say('무사히 도망쳤다!');mode='map';setTimeout(toMap,500);ui('');return}else say('도망치지 못했다!');endP(1)}
function hit(d,k,c){E.hp=Math.max(0,E.hp-d);ex=10;hx=35;fx.push({t:0,k,x:230,y:80,c});fx.push({t:0,txt:d,x:215,y:70,c:'#fff'});snd(k=='p'?180:420,.15,'sawtooth',.07)}
function A(){const s=ST(),c=R(100)<9,a=Math.max(s.atk,s.mag*.4),d=dm(a,c?1.7:1,E.def);say(`${CL[P.c][0]}의 공격! ${c?'크리티컬! ':''}${d} 데미지`);hit(d,'p','#fff');endP()}
function S(n){const s=ST(),t=CL[P.c][8][n],nm=CL[P.c][7].split(',')[n];P.mp-=MC[n];if(t=='h'){const v=Math.round(s.mag*MU[n]*1.3);P.hp=Math.min(s.mhp,P.hp+v);say(`${nm}! HP ${v} 회복`);fx.push({t:0,k:'h',x:90,y:110});snd(880,.3,'sine')}else{const d=dm(t=='p'?s.atk:s.mag,MU[n],E.def);say(`${nm}! ${d} 데미지`);hit(d,t=='p'||t=='d'?'p':'m',CL[P.c][2]);if(t=='d'){P.hp=Math.min(s.mhp,P.hp+d/2);say('체력을 흡수했다!')}}endP()}
function endP(skip){hud();if(E.hp<=0){ui('');return setTimeout(win,700)}ui('');setTimeout(()=>{const s=ST(),st=E.boss&&R(100)<18,d=Math.round(dm(E.atk,st?1.8:1,s.def)*(P.df?.5:1));P.hp=Math.max(0,P.hp-d);hx=-12;fx.push({t:0,txt:d,x:70,y:85,c:'#f66'});say(`${E.n}의 ${st?'강력한 일격! ':'공격! '}${d} 데미지`);snd(120,.2,'square',.08);hud();if(P.hp<=0){say('눈앞이 캄캄해졌다…');ui(B('마을로 귀환','REV()'))}else bmain()},650)}
function REV(){P.g>>=1;const s=ST();P.hp=s.mhp;P.mp=s.mmp;P.x=P.rx=28;P.y=P.ry=29;mode='map';toMap()}
